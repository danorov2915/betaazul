<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Azul - Tarjeta Digital | Daniel Ortuño Oviedo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #050E22 0%, #0A1931 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #0A1931;
        }
        .card-container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 28px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(201,168,106,0.35);
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-header {
            background: linear-gradient(135deg, #0A1931, #0E2F5B);
            color: white;
            padding: 32px 20px 24px 20px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid #C9A86A;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.18em;
            margin-bottom: 6px;
            text-transform: uppercase;
            color: #F9E7B0;
        }
        .tagline {
            font-size: 11px;
            letter-spacing: 0.36em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
        }
        .card-body {
            padding: 24px 20px 28px 20px;
            text-align: center;
            background: #ffffff;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 700;
            color: #0A1931;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }
        .profile-title {
            font-size: 12.5px;
            color: #C9A86A;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f8fafc;
            border: 1.5px solid rgba(10,25,49,0.1);
            padding: 13px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: #0A1931;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(10,25,49,0.06);
        }
        .btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }
        .btn-whatsapp {
            background: #25d366;
            color: white;
            border-color: #25d366;
            box-shadow: 0 4px 12px rgba(37,211,102,0.3);
        }
        .btn-whatsapp:hover {
            background: #22bf5b;
        }
        .btn-call {
            background: #0A1931;
            color: white;
            border-color: #0A1931;
            box-shadow: 0 4px 12px rgba(10,25,49,0.25);
        }
        .btn-call:hover {
            background: #11294f;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #0A1931;
            font-weight: 700;
            font-size: 13px;
            border: 1.5px solid rgba(10,25,49,0.1);
            transition: all 0.2s;
        }
        .social-icon:hover {
            background: #0A1931;
            color: #F9E7B0;
            border-color: #0A1931;
        }
        .qr-section {
            background: #fcfbf9;
            padding: 14px;
            border-radius: 18px;
            border: 1.5px dashed rgba(201,168,106,0.4);
            display: inline-block;
            margin-top: 4px;
        }
        .qr-section img {
            width: 120px;
            height: 120px;
            display: block;
            margin: 0 auto 6px auto;
            border-radius: 8px;
        }
        .qr-text {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .footer {
            background: #f8fafc;
            padding: 10px;
            text-align: center;
            font-size: 10.5px;
            color: #64748b;
            border-top: 1px solid rgba(10,25,49,0.06);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card-header">
            <div class="logo">Beta Azul</div>
            <div class="tagline">Agencia de Viajes Digital</div>
        </div>
        <div class="card-body">
            <div class="profile-name">Daniel Ortuño Oviedo</div>
            <div class="profile-title">Fundador & Asesor de Viajes</div>
            
            <div class="btn-group">
                <a href="tel:+52 244 447 0237" class="btn btn-call">
                    📞 Llamar Directamente
                </a>
                <a href="https://wa.me/522444470237?text=Hola Daniel, vi la tarjeta digital de Beta Azul y me interesa información sobre sus paquetes de viaje." class="btn btn-whatsapp" target="_blank">
                    💬 Enviar WhatsApp
                </a>
            </div>

            <div class="social-links">
                <a href="https://facebook.com" class="social-icon" target="_blank" title="Facebook">FB</a>
                <a href="https://instagram.com" class="social-icon" target="_blank" title="Instagram">IG</a>
                <a href="https://tiktok.com" class="social-icon" target="_blank" title="TikTok">TK</a>
                <a href="https://youtube.com" class="social-icon" target="_blank" title="YouTube">YT</a>
            </div>

            <div class="qr-section">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://danorov2915.github.io/betaazul/" alt="Código QR de la tarjeta">
                <div class="qr-text">Escanea para compartir tarjeta</div>
            </div>
        </div>
        <div class="footer">
            ATLIXCO, PUEBLA • 100% DIGITAL
        </div>
    </div>
</body>
</html>
