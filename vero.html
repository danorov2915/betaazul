<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Azul - Tarjeta Digital | Verónica Hernández Echeverría</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #0a1931 0%, #030712 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #fff;
        }
        .card-frame {
            width: 100%;
            max-width: 410px;
            background: linear-gradient(180deg, #091730 0%, #050e21 60%, #02050c 100%);
            border-radius: 36px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.85), inset 0 0 0 2px rgba(212,175,55,0.45);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 24px 18px 20px 18px;
        }
        
        /* Fondo con montañas y palmeras vectoriales */
        .scenic-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 220px;
            pointer-events: none;
            opacity: 0.25;
            z-index: 1;
        }

        /* Cabecera con Logo Artístico de Alas y Estrellas */
        .header-section {
            position: relative;
            z-index: 2;
            text-align: center;
            padding-top: 6px;
            margin-bottom: 16px;
        }
        .est-badge {
            font-size: 8.5px;
            letter-spacing: 0.35em;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .logo-svg-container {
            width: 110px;
            height: 70px;
            margin: 0 auto 4px auto;
            filter: drop-shadow(0 4px 12px rgba(212,175,55,0.4));
        }
        .brand-title {
            font-size: 26px;
            font-weight: 900;
            color: #fcefb4;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(212,175,55,0.4);
            margin-top: 2px;
        }
        .brand-subtitle {
            font-size: 10.5px;
            color: #b3c6dc;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Tarjeta Central de Lujo (Estilo Pergamino/Crema con Oro) */
        .luxury-box {
            position: relative;
            z-index: 2;
            background: linear-gradient(135deg, #fffdf8 0%, #f4ebd0 100%);
            border-radius: 24px;
            padding: 20px 16px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(212,175,55,0.75);
            color: #0a1931;
            margin-bottom: 14px;
        }
        .profile-name {
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            color: #0a1931;
            margin-bottom: 3px;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }
        .profile-role {
            font-size: 10px;
            font-weight: 800;
            text-align: center;
            color: #8c733a;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 16px;
        }

        /* Filas de contacto estilo botón elegante */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }
        .contact-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(212,175,55,0.4);
            padding: 10px 14px;
            border-radius: 12px;
            text-decoration: none;
            color: #0a1931;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .contact-row:hover {
            background: #ffffff;
            border-color: #d4af37;
            transform: translateY(-1px);
        }
        .contact-row.whatsapp-action {
            background: #25d366;
            color: white;
            border-color: #25d366;
            font-weight: 800;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(37,211,102,0.35);
        }
        .contact-row.whatsapp-action:hover {
            background: #22bf5b;
        }
        .icon-box {
            font-size: 15px;
            width: 22px;
            text-align: center;
        }
        .text-box {
            font-size: 12px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Redes Sociales Grid */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }
        .social-btn {
            background: #0a1931;
            color: #f9e7b0;
            text-decoration: none;
            text-align: center;
            padding: 8px 6px;
            border-radius: 9px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(212,175,55,0.3);
            transition: all 0.2s;
        }
        .social-btn:hover {
            background: #13274a;
            border-color: #d4af37;
        }

        /* Sección de Código QR inferior */
        .qr-section-bottom {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(212, 175, 55, 0.5);
            border-radius: 18px;
            padding: 10px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .qr-section-bottom img {
            width: 85px;
            height: 85px;
            display: block;
            margin: 0 auto 4px auto;
            border-radius: 6px;
        }
        .qr-caption {
            font-size: 9px;
            color: #d4af37;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card-frame">
        
        <!-- Fondo escénico con montañas y palmeras -->
        <svg class="scenic-bg" viewBox="0 0 400 200" preserveAspectRatio="none">
            <!-- Montañas -->
            <polygon points="0,200 80,110 160,170 250,80 340,150 400,100 400,200" fill="#0d2347"/>
            <polygon points="0,200 120,130 220,190 310,120 400,170 400,200" fill="#061226" opacity="0.8"/>
            <!-- Palmas simplificadas -->
            <path d="M350,200 L350,130 M350,130 Q330,115 315,125 M350,130 Q370,115 385,125 M350,140 Q335,130 325,140 M350,140 Q365,130 375,140" stroke="#0d2347" stroke-width="3" fill="none"/>
            <path d="M50,200 L50,140 M50,140 Q35,125 25,135 M50,140 Q65,125 75,135" stroke="#0d2347" stroke-width="2.5" fill="none"/>
        </svg>

        <!-- Cabecera con Logotipo Artístico (Alas, estrella y círculo de lujo) -->
        <div class="header-section">
            <div class="est-badge">EST. 2024 • LUJO Y TURISMO</div>
            <div class="logo-svg-container">
                <svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Alas estilizadas doradas -->
                    <path d="M60 40 C40 20 10 25 2 35 C15 50 35 55 60 40 Z" fill="url(#goldGrad)" opacity="0.85"/>
                    <path d="M60 40 C80 20 110 25 118 35 C105 50 85 55 60 40 Z" fill="url(#goldGrad)" opacity="0.85"/>
                    <!-- Círculo central con estrella / joya -->
                    <circle cx="60" cy="38" r="18" fill="#0a1931" stroke="url(#goldGrad)" stroke-width="3"/>
                    <polygon points="60,24 64,34 74,38 64,42 60,52 56,42 46,38 56,34" fill="#f9e7b0"/>
                    <!-- Sello inferior -->
                    <path d="M35 58 Q60 70 85 58" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f9e7b0"/>
                            <stop offset="50%" stop-color="#d4af37"/>
                            <stop offset="100%" stop-color="#9a7b2c"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="brand-title">Beta Azul</div>
            <div class="brand-subtitle">Viajes Turísticos</div>
        </div>

        <!-- Tarjeta Central de Lujo (Pergamino con datos) -->
        <div class="luxury-box">
            <div class="profile-name">Verónica Hernández Echeverría</div>
            <div class="profile-role">DIRECTORA GENERAL</div>
            
            <div class="contact-list">
                <a href="tel:+52 244 447 0237" class="contact-row">
                    <span class="icon-box">📞</span>
                    <span class="text-box">TEL: +52 244 447 0237</span>
                </a>
                
                <a href="https://wa.me/522444470237?text=Hola Verónica, vi la tarjeta digital de Beta Azul y me gustaría recibir asesoría de viajes." class="contact-row whatsapp-action" target="_blank">
                    <span class="icon-box">💬</span>
                    <span class="text-box">ENVIAR WHATSAPP</span>
                </a>

                <a href="mailto:betaazulviajes@gmail.com" class="contact-row">
                    <span class="icon-box">✉️</span>
                    <span class="text-box">betaazulviajes@gmail.com</span>
                </a>
                
                <a href="https://viajesbetaazul.wixsite.com/beta-azul" class="contact-row" target="_blank">
                    <span class="icon-box">🌐</span>
                    <span class="text-box">Sitio Web Oficial</span>
                </a>
            </div>

            <div class="social-grid">
                <a href="https://facebook.com" class="social-btn" target="_blank">Facebook</a>
                <a href="https://instagram.com" class="social-btn" target="_blank">Instagram</a>
                <a href="https://tiktok.com" class="social-btn" target="_blank">TikTok</a>
                <a href="https://youtube.com" class="social-btn" target="_blank">YouTube</a>
            </div>
        </div>

        <!-- Código QR inferior con diseño de lujo -->
        <div class="qr-section-bottom">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://danorov2915.github.io/betaazul/vero.html" alt="Código QR">
            <div class="qr-caption">Escanea para compartir tarjeta</div>
        </div>
    </div>
</body>
</html>
